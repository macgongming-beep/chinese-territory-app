<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>앱 아이콘 비교</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #EDECE9; padding: 40px 32px 64px; }
  h1 { font-size: 18px; font-weight: 700; color: #1A1A1A; margin-bottom: 8px; }
  p  { font-size: 13px; color: #888; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(3, 140px); gap: 20px 16px; }
  .sep  { grid-column: 1/-1; height: 1px; background: #D5D3CF; margin: 8px 0; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .card img { width: 96px; height: 96px; border-radius: 20px; box-shadow: 0 2px 14px rgba(0,0,0,.18); }
  .sym  { font-size: 11px; font-weight: 700; color: #B8832A; letter-spacing:.06em; }
  .lbl  { font-size: 12px; font-weight: 600; color: #37352F; text-align:center; line-height:1.3; }
  .col  { font-size: 11px; color: #999; }
</style>
</head>
<body>
<h1>앱 아이콘 — 디자인 비교</h1>
<p>심볼 4가지 × 색상 3가지 (차콜 / 코발트 / 웜다크)</p>
<div class="grid">
  <div class="card">
        <img src="prev-A-charcoal.png">
        <span class="sym">A</span>
        <span class="lbl">로케이션 핀</span>
        <span class="col">차콜</span>
      </div><div class="card">
        <img src="prev-A-cobalt.png">
        <span class="sym">A</span>
        <span class="lbl">로케이션 핀</span>
        <span class="col">코발트</span>
      </div><div class="card">
        <img src="prev-A-warm.png">
        <span class="sym">A</span>
        <span class="lbl">로케이션 핀</span>
        <span class="col">웜다크</span>
      </div><div class="sep"></div><div class="card">
        <img src="prev-B-charcoal.png">
        <span class="sym">B</span>
        <span class="lbl">구역 카드</span>
        <span class="col">차콜</span>
      </div><div class="card">
        <img src="prev-B-cobalt.png">
        <span class="sym">B</span>
        <span class="lbl">구역 카드</span>
        <span class="col">코발트</span>
      </div><div class="card">
        <img src="prev-B-warm.png">
        <span class="sym">B</span>
        <span class="lbl">구역 카드</span>
        <span class="col">웜다크</span>
      </div><div class="sep"></div><div class="card">
        <img src="prev-C-charcoal.png">
        <span class="sym">C</span>
        <span class="lbl">구역 경계선</span>
        <span class="col">차콜</span>
      </div><div class="card">
        <img src="prev-C-cobalt.png">
        <span class="sym">C</span>
        <span class="lbl">구역 경계선</span>
        <span class="col">코발트</span>
      </div><div class="card">
        <img src="prev-C-warm.png">
        <span class="sym">C</span>
        <span class="lbl">구역 경계선</span>
        <span class="col">웜다크</span>
      </div><div class="sep"></div><div class="card">
        <img src="prev-D-charcoal.png">
        <span class="sym">D</span>
        <span class="lbl">2×2 블록 그리드</span>
        <span class="col">차콜</span>
      </div><div class="card">
        <img src="prev-D-cobalt.png">
        <span class="sym">D</span>
        <span class="lbl">2×2 블록 그리드</span>
        <span class="col">코발트</span>
      </div><div class="card">
        <img src="prev-D-warm.png">
        <span class="sym">D</span>
        <span class="lbl">2×2 블록 그리드</span>
        <span class="col">웜다크</span>
      </div>
</div>
</body>
</html>
