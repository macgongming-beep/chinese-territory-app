<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>아이콘 비교 2차</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #EDECE9; padding: 40px 32px 80px; }
  h1 { font-size: 18px; font-weight: 700; color: #1A1A1A; margin-bottom: 6px; }
  p  { font-size: 13px; color: #888; margin-bottom: 36px; }
  .section { margin-bottom: 40px; }
  .section h2 { font-size: 11px; font-weight: 700; color: #B8832A; letter-spacing:.1em;
                text-transform: uppercase; margin-bottom: 14px; }
  .row { display: flex; gap: 14px; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .card img { width: 96px; height: 96px; border-radius: 20px;
              box-shadow: 0 3px 16px rgba(0,0,0,.2); }
  .lbl { font-size: 11px; color: #999; }
</style>
</head>
<body>
<h1>아이콘 2차 비교 — 완전 다른 느낌</h1>
<p>E·F·G·H 4가지 심볼 × 차콜 / 코발트 / 웜다크 / 포레스트</p>

<div class="section">
  <h2>E — 교차 사각형</h2>
  <div class="row">
    
    <div class="card">
      <img src="prev2-E-charcoal.png">
      <span class="lbl">차콜</span>
    </div>
    <div class="card">
      <img src="prev2-E-cobalt.png">
      <span class="lbl">코발트</span>
    </div>
    <div class="card">
      <img src="prev2-E-warm.png">
      <span class="lbl">웜다크</span>
    </div>
    <div class="card">
      <img src="prev2-E-forest.png">
      <span class="lbl">포레스트</span>
    </div>
  </div>
</div>
<div class="section">
  <h2>F — 링 + 닷</h2>
  <div class="row">
    
    <div class="card">
      <img src="prev2-F-charcoal.png">
      <span class="lbl">차콜</span>
    </div>
    <div class="card">
      <img src="prev2-F-cobalt.png">
      <span class="lbl">코발트</span>
    </div>
    <div class="card">
      <img src="prev2-F-warm.png">
      <span class="lbl">웜다크</span>
    </div>
    <div class="card">
      <img src="prev2-F-forest.png">
      <span class="lbl">포레스트</span>
    </div>
  </div>
</div>
<div class="section">
  <h2>G — 접힌 카드</h2>
  <div class="row">
    
    <div class="card">
      <img src="prev2-G-charcoal.png">
      <span class="lbl">차콜</span>
    </div>
    <div class="card">
      <img src="prev2-G-cobalt.png">
      <span class="lbl">코발트</span>
    </div>
    <div class="card">
      <img src="prev2-G-warm.png">
      <span class="lbl">웜다크</span>
    </div>
    <div class="card">
      <img src="prev2-G-forest.png">
      <span class="lbl">포레스트</span>
    </div>
  </div>
</div>
<div class="section">
  <h2>H — 세 줄 바</h2>
  <div class="row">
    
    <div class="card">
      <img src="prev2-H-charcoal.png">
      <span class="lbl">차콜</span>
    </div>
    <div class="card">
      <img src="prev2-H-cobalt.png">
      <span class="lbl">코발트</span>
    </div>
    <div class="card">
      <img src="prev2-H-warm.png">
      <span class="lbl">웜다크</span>
    </div>
    <div class="card">
      <img src="prev2-H-forest.png">
      <span class="lbl">포레스트</span>
    </div>
  </div>
</div>
</body>
</html>
