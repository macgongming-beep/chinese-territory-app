<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Warm amber background -->
  <rect width="512" height="512" rx="0" fill="#B8832A"/>

  <!-- Symbol: two overlapping territory rectangles, minimal -->
  <!-- Left/top block -->
  <rect x="112" y="140" width="196" height="196" rx="28" fill="rgba(255,255,255,0.22)"/>
  <!-- Right/bottom block (offset, overlapping) -->
  <rect x="204" y="196" width="196" height="196" rx="28" fill="rgba(255,255,255,0.0)" stroke="rgba(255,255,255,0.85)" stroke-width="18"/>
  <!-- Small location dot — top right of right block -->
  <circle cx="358" cy="228" r="22" fill="white"/>
</svg>
